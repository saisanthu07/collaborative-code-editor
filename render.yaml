services:
  - type: web
    name: collab-editor-server
    runtime: node
    rootDir: server
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_DAYS
        value: 30
      - key: GUEST_TOKEN_TTL_HOURS
        value: 24
      - key: MAX_GUESTS_PER_ROOM
        value: 50
      - key: CLIENT_URL
        sync: false
      - key: JUDGE0_API_URL
        value: https://ce.judge0.com
      - key: JUDGE0_API_KEY
        sync: false
      - key: JUDGE0_API_HOST
        value: ce.judge0.com
      - key: PISTON_API_URL
        value: https://emkc.org/api/v2/piston
      - key: REDIS_URL
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: METRICS_TOKEN
        generateValue: true

  - type: web
    name: collab-editor-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
      - key: VITE_YJS_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
